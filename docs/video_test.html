<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video BGM Test</title>
</head>
<body style="background:#111;color:#0f0;font-family:monospace;padding:20px;text-align:center;">
<h2 style="font-size:20px;">Video Playback – yimeng 60s</h2>
<p id="status" style="font-size:18px;">TAP ANYWHERE TO PLAY</p>
<button id="btn" style="font-size:28px;padding:24px 48px;margin:20px;background:#0a0;color:#fff;border:none;border-radius:12px;">▶ PLAY VIDEO</button>
<video id="v" controls loop preload="auto" style="width:100%;"></video>
<script>
var v = document.getElementById('v');
var st = document.getElementById('status');
var btn = document.getElementById('btn');
v.src = 'yimeng_60s.mp4';
function play(){
  st.textContent = 'PLAYING: 以梦为马 13-14min';
  v.play().then(function(){ st.textContent = 'PLAYING: 以梦为马 13-14min'; })
   .catch(function(e){ st.textContent = 'ERR: ' + e.message; });
}
btn.onclick = function(e){ e.stopPropagation(); play(); };
document.body.onclick = play;
v.onplay = function(){ st.textContent = 'PLAYING'; };
v.onpause = function(){ st.textContent = 'PAUSED'; };
</script>
</body>
</html>
